name: VPN list refresh

# Rebuilds the VPN / datacenter / Tor IP dataset from the public lists and
# writes it to the VPN_DATA KV namespace, once a day.
#
# The Worker has a cron for this, but it cannot finish on the Workers Free
# plan: the build needs 0.2-0.3 s of CPU and the free plan allows 10 ms per
# run. This job runs the same code (apps/api/scripts/refresh-vpn-dataset.ts
# calls the Worker's refreshVpnDataset) on a GitHub runner and writes through
# Cloudflare's REST API. On Workers Paid you do not need it.
#
# Repository secrets (Settings > Secrets and variables > Actions):
#   CLOUDFLARE_KV_API_TOKEN  an API token with the account permission
#                            "Workers KV Storage: Edit" and nothing else
#   CLOUDFLARE_ACCOUNT_ID    the Cloudflare account id
# Optional repository variable:
#   VPN_KV_NAMESPACE_ID      the VPN_DATA namespace id, when it is not the one
#                            in apps/api/wrangler.toml
# Without the two secrets the job reports "not set up" and passes.
#
# Only scheduled and manual runs, never pull requests: code from a fork can
# never run with the token.

on:
  schedule:
    # After X4BNet's daily list build (08:45 UTC), like the Worker's own cron.
    - cron: "40 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vpn-refresh
  cancel-in-progress: false

jobs:
  refresh:
    name: Build and upload
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # No install step: the script and what it imports use only Node itself.
      - name: Refresh the dataset
        working-directory: apps/api
        env:
          CLOUDFLARE_KV_API_TOKEN: ${{ secrets.CLOUDFLARE_KV_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VPN_KV_NAMESPACE_ID: ${{ vars.VPN_KV_NAMESPACE_ID }}
        run: >-
          node --experimental-transform-types --disable-warning=ExperimentalWarning
          --import ./scripts/verify-provider/register-ts-resolve.mjs
          scripts/refresh-vpn-dataset.ts
