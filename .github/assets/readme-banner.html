<!doctype html>
<!--
  Source of the README header. Rendered to readme-banner-light.png and
  readme-banner-dark.png by render-readme-banner.mjs (same folder):
    node .github/assets/render-readme-banner.mjs
  ?theme=dark picks the dark version. Every claim here must stay true of the code.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@500&display=block" rel="stylesheet">
<style>
  :root { --bg: #ffffff; --ink: #0a0a0a; --muted: #4a4a4a; --rule: #0a0a0a; --accent: #e42313; --mark-low: #0a0a0a; }
  :root[data-theme="dark"] { --bg: #0a0a0a; --ink: #ffffff; --muted: #a3a3a3; --rule: #3a3a3a; --mark-low: #ffffff; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1280px; height: 400px; background: var(--bg); }
  .frame {
    width: 1280px; height: 400px; border: 2px solid var(--rule);
    display: grid; grid-template-rows: 1fr 76px; background: var(--bg);
  }
  .top { display: grid; grid-template-columns: 324px 1fr; }
  .mark { display: flex; align-items: center; justify-content: center; border-right: 2px solid var(--rule); }
  .mark svg { width: 196px; height: 196px; display: block; }
  .words { display: flex; flex-direction: column; justify-content: center; padding: 0 64px; }
  .eyebrow { font: 500 15px/1 'JetBrains Mono', monospace; letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent); }
  .name { font: 700 108px/1 'Space Grotesk', sans-serif; letter-spacing: -0.045em; color: var(--ink); margin-top: 22px; }
  .tagline { font: 400 29px/1.3 'Inter', sans-serif; letter-spacing: -0.01em; color: var(--muted); margin-top: 22px; }
  .strip { display: grid; grid-template-columns: 324px repeat(4, 1fr); border-top: 2px solid var(--rule); }
  .strip div {
    display: flex; align-items: center; gap: 10px; padding: 0 22px; white-space: nowrap;
    font: 500 13px/1 'JetBrains Mono', monospace; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink);
  }
  .strip div + div { border-left: 2px solid var(--rule); }
  .strip div::before { content: ''; width: 8px; height: 8px; background: var(--accent); flex: none; }
  .strip .lead { background: var(--accent); color: #ffffff; justify-content: center; }
  .strip .lead::before { display: none; }
</style>
</head>
<body>
<div class="frame">
  <div class="top">
    <div class="mark" aria-hidden="true">
      <svg viewBox="0 0 32 32">
        <path fill="#e42313" fill-rule="evenodd" d="M0 0 H28 L0 28 Z M4 4 h8 v8 h-8 Z"/>
        <path fill="var(--mark-low)" style="fill: var(--mark-low)" fill-rule="evenodd" d="M32 4 V32 H4 Z M20 20 h8 v8 h-8 Z"/>
      </svg>
    </div>
    <div class="words">
      <p class="eyebrow">Open-source PPP pricing</p>
      <p class="name">GoPayLocal</p>
      <p class="tagline">Purchasing power parity discounts for your website,<br>worked out per country at the Cloudflare edge.</p>
    </div>
  </div>
  <div class="strip">
    <div class="lead">AGPL-3.0 · MIT SDKs</div>
    <div>One script tag</div>
    <div>VPN detection</div>
    <div>Local currencies</div>
    <div>9 payment platforms</div>
  </div>
</div>
<script>
  if (new URLSearchParams(location.search).get('theme') === 'dark') document.documentElement.dataset.theme = 'dark';
</script>
</body>
</html>
