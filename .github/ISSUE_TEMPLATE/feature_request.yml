name: Feature request
description: Suggest a new feature or an improvement to an existing one.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. Describing the problem you are trying to solve helps more than a finished design.

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Who is affected, and what do they do today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you have considered

  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - API
        - Merchant dashboard
        - Admin dashboard
        - Banner script
        - JavaScript SDK (@gopaylocal/js)
        - React SDK (@gopaylocal/react)
        - Payment provider integrations
        - Self-hosting
        - Docs
        - Other or not sure

  - type: dropdown
    id: contribute
    attributes:
      label: Would you be willing to contribute this?
      options:
        - "Yes, I would like to open a pull request"
        - "Maybe, with some guidance"
        - "No"
