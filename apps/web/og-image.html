<!doctype html>
<!-- Source of public/og-image.png. Re-render: open this file in Chromium with a 1200x630 viewport at device scale 1, wait for the Google Fonts to load, screenshot the viewport and save it over public/og-image.png.
     Feeds show this image at about 500px wide (300px in chat apps), so nothing here is smaller than 28px. Keep it that way.
     Numbers: $19 = PLAN_PRICES_USD.pro.month, 20M = PRO_FAIR_USE_API_HITS_PER_MONTH, 9 = integrations in src/lib/landing-data.ts, table rows = DEFAULT_PARITY_TIERS (packages/shared); update this file when they change. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1200">
<title>GoPayLocal OG image</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600&family=Space+Grotesk:wght@700&display=block">
<style>
  :root {
    --bg: #0A0A0A;
    --surface: #161616;
    --border: #333333;
    --text-1: #F5F5F5;
    --text-2: #D0D0D0;
    --accent: #E42313;
    --accent-text: #FF3B2E;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; background: var(--bg); }
  body { position: relative; color: var(--text-1); font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; }
  .abs { position: absolute; }
  .bar { left: 0; top: 0; width: 20px; height: 630px; background: var(--accent); }
  .brand { left: 80px; top: 64px; display: flex; align-items: center; gap: 16px; }
  .brand svg { width: 48px; height: 48px; display: block; }
  .brand span { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 36px; letter-spacing: -0.025em; line-height: 48px; }
  h1 { left: 80px; top: 164px; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 84px; line-height: 88px; letter-spacing: -0.04em; white-space: nowrap; }
  .foot { left: 80px; top: 516px; font-size: 32px; line-height: 40px; font-weight: 500; color: var(--text-2); white-space: nowrap; }
  .foot b { color: var(--accent-text); font-weight: 600; padding: 0 12px; }
  .table { right: 80px; top: 172px; width: 340px; border: 2px solid var(--border); background: var(--surface); }
  .row { height: 84px; display: flex; align-items: center; justify-content: space-between; padding: 0 28px; }
  .row + .row { border-top: 2px solid var(--border); }
  .country { display: flex; align-items: center; gap: 14px; font-size: 30px; font-weight: 500; color: var(--text-1); }
  .flag { font-size: 30px; line-height: 1; }
  .pct { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 36px; color: var(--accent-text); font-variant-numeric: tabular-nums; }
  .full { font-size: 28px; font-weight: 500; color: var(--text-2); }
</style>
</head>
<body>
  <div class="abs bar"></div>

  <div class="abs brand">
    <svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path fill="#E42313" fill-rule="evenodd" d="M0 0 H28 L0 28 Z M4 4 h8 v8 h-8 Z"></path>
      <path fill="#FFFFFF" fill-rule="evenodd" d="M32 4 V32 H4 Z M20 20 h8 v8 h-8 Z"></path>
    </svg>
    <span>GoPayLocal</span>
  </div>

  <h1 class="abs">Fair prices.<br>More customers.<br>Zero effort.</h1>

  <div class="abs table">
    <div class="row"><span class="country"><span class="flag">🇮🇳</span>India</span><span class="pct">-65%</span></div>
    <div class="row"><span class="country"><span class="flag">🇧🇷</span>Brazil</span><span class="pct">-35%</span></div>
    <div class="row"><span class="country"><span class="flag">🇺🇸</span>USA</span><span class="full">Full price</span></div>
  </div>

  <p class="abs foot">Open source<b>·</b>9 integrations<b>·</b>Pro $19/mo for 20M API calls</p>
</body>
</html>
