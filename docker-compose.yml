# Local Postgres for development (postgres, :5433) and integration tests
# (postgres-test, :5434). GoPayLocal needs Postgres 15 or newer: the schema uses a
# NULLS NOT DISTINCT unique constraint (analytics_rollups). These services run 18,
# the same major version as CI.

services:
  postgres:
    image: postgres:18-alpine
    container_name: gopaylocal-postgres
    environment:
      POSTGRES_USER: gopaylocal
      POSTGRES_PASSWORD: gopaylocal
      POSTGRES_DB: gopaylocal
    ports:
      - "5433:5432"
    volumes:
      - gopaylocal_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gopaylocal"]
      interval: 2s
      timeout: 5s
      retries: 10

  postgres-test:
    image: postgres:18-alpine
    container_name: gopaylocal-postgres-test
    environment:
      POSTGRES_USER: gopaylocal_test
      POSTGRES_PASSWORD: gopaylocal_test
      POSTGRES_DB: gopaylocal_test
    ports:
      - "5434:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gopaylocal_test"]
      interval: 2s
      timeout: 5s
      retries: 10

volumes:
  gopaylocal_pgdata:
